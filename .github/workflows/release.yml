name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, such as v0.2.1
        required: true
        type: string
      confirm_publish:
        description: Confirm this immutable PyPI publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}

    steps:
      - name: Require dispatch from main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish must be dispatched from the main branch." >&2
            exit 1
          fi

      - name: Check out the requested tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate the tag, version, and main ancestry
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG_INPUT"].strip()
          with Path("pyproject.toml").open("rb") as project_file:
              project = tomllib.load(project_file)["project"]
          if "version" not in project.get("dynamic", ()):
              raise SystemExit(
                  "pyproject.toml must declare version as dynamic, sourced from version.py."
              )

          # version.py is the hatch version source; the assignment line is the release version.
          version_source = Path("livekit/plugins/prosodyai/version.py").read_text(
              encoding="utf-8"
          )
          version = ""
          for line in version_source.splitlines():
              if line.startswith("__version__"):
                  version = line.split("=", 1)[1].strip().strip('"')
                  break
          if not version:
              raise SystemExit(
                  "livekit/plugins/prosodyai/version.py does not assign __version__."
              )

          readme = Path("README.md").read_text(encoding="utf-8").lower()
          if "pip install livekit-plugins-prosodyai" not in readme:
              raise SystemExit(
                  "README.md must document `pip install livekit-plugins-prosodyai` before publishing."
              )
          stale_install_text = (
              "not yet published to pypi",
              "not published to pypi",
              "livekit-plugins-prosodyai @ git+",
              "git+https://github.com/prosodyai/livekit",
          )
          stale_marker = next((marker for marker in stale_install_text if marker in readme), None)
          if stale_marker is not None:
              raise SystemExit(
                  "README.md still describes the pre-PyPI GitHub installation path: "
                  f"{stale_marker!r}."
              )

          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag {tag!r} does not match project version {expected_tag!r}."
              )

          subprocess.run(["git", "show-ref", "--verify", f"refs/tags/{tag}"], check=True)
          release_sha = subprocess.check_output(
              ["git", "rev-parse", f"{tag}^{{commit}}"], text=True
          ).strip()
          checked_out_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if release_sha != checked_out_sha:
              raise SystemExit("The checked-out commit does not match the requested tag.")

          subprocess.run(
              ["git", "merge-base", "--is-ancestor", release_sha, "origin/main"],
              check=True,
          )
          if len(release_sha) != 40 or any(
              char not in "0123456789abcdef" for char in release_sha
          ):
              raise SystemExit("The release tag did not resolve to a full commit SHA.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"release_sha={release_sha}\n")
              output.write(f"release_tag={tag}\n")
              output.write(f"release_version={version}\n")
          PY

      - name: Install release checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff build twine

      - name: Verify package version and plugin import
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          from livekit.agents import Plugin
          from livekit.plugins import prosodyai

          installed = version("livekit-plugins-prosodyai")
          if installed != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(
                  f"Installed version {installed!r} does not match the release version."
              )
          registered = [
              plugin
              for plugin in Plugin.registered_plugins
              if plugin.package == "livekit.plugins.prosodyai"
          ]
          if len(registered) != 1 or registered[0].version != installed:
              raise SystemExit("ProsodyAI did not register exactly once as a LiveKit plugin.")
          PY

      # The same gate CI runs on every PR to main, on the tagged release commit.
      - name: Run release checks
        run: |
          ruff check . --line-length 100 --select E,W,F,I,B,C4 --ignore E501,E402,B904,B008,B007
          ruff format --check . --line-length 100
          python -m build
          python -m twine check dist/*

      - name: Preserve verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: vars.PYPI_PUBLISH_ENABLED == 'true' && inputs.confirm_publish == true
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/livekit-plugins-prosodyai/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
